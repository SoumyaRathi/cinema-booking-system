<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daily/Monthly Sales Report</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Fix deprecated fragment syntax -->
    <th:block th:replace="~{notification-fragment :: notification-styles}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 bg-dark text-white p-0" style="min-height: 100vh;">
                <div class="p-4">
                    <h4>Admin Panel</h4>
                </div>
                <div class="list-group list-group-flush">
                    <a th:href="@{/admin/dashboard}" class="list-group-item list-group-item-action bg-dark text-white">Dashboard</a>
                    <a th:href="@{/admin/movies}" class="list-group-item list-group-item-action bg-dark text-white">Movies</a>
                    <a th:href="@{/admin/users}" class="list-group-item list-group-item-action bg-dark text-white">Users</a>
                    <a th:href="@{/admin/bookings}" class="list-group-item list-group-item-action bg-dark text-white">Bookings</a>
                    <a th:href="@{/admin/no-shows}" class="list-group-item list-group-item-action bg-dark text-white">
                        No-Shows
                    </a>
                    <a th:href="@{/admin/reports}" class="list-group-item list-group-item-action bg-dark text-white active">
                        Reports
                    </a>
                    <a th:href="@{/admin/notifications}" class="list-group-item list-group-item-action bg-dark text-white">
                        Notifications
                        <span th:if="${unreadNotificationsCount > 0}" class="badge badge-danger ml-2" th:text="${unreadNotificationsCount}">0</span>
                    </a>
                    <a th:href="@{/admin/profile}" class="list-group-item list-group-item-action bg-dark text-white">Profile</a>
                    <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-dark text-white">Logout</a>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Daily/Monthly Sales Report</h2>
                    <!-- Fix notification fragment syntax -->
                    <div th:replace="~{notification-fragment :: notification-bell}"></div>
                </div>
                
                <!-- Report Type and Date Range Filter -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Report Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="mr-2">Report Type:</label>
                            <a th:href="@{/admin/reports/daily-monthly-sales(reportType='daily', startDate=${startDate}, endDate=${endDate})}" 
                               class="btn report-type-btn mr-2" 
                               th:classappend="${reportType == 'daily' ? 'btn-primary' : 'btn-outline-primary'}">Daily</a>
                            <a th:href="@{/admin/reports/daily-monthly-sales(reportType='monthly', startDate=${startDate}, endDate=${endDate})}" 
                               class="btn report-type-btn" 
                               th:classappend="${reportType == 'monthly' ? 'btn-primary' : 'btn-outline-primary'}">Monthly</a>
                        </div>
                        <form th:action="@{/admin/reports/daily-monthly-sales}" method="get" class="form-inline">
                            <input type="hidden" name="reportType" th:value="${reportType}">
                            <div class="form-group mr-3">
                                <label for="startDate" class="mr-2">Start Date:</label>
                                <input type="date" id="startDate" name="startDate" class="form-control" th:value="${startDate}">
                            </div>
                            <div class="form-group mr-3">
                                <label for="endDate" class="mr-2">End Date:</label>
                                <input type="date" id="endDate" name="endDate" class="form-control" th:value="${endDate}">
                            </div>
                            <button type="submit" class="btn btn-primary">Apply Filter</button>
                        </form>
                    </div>
                </div>
                
                <!-- Chart -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 th:text="${reportType == 'daily' ? 'Daily Sales Trend' : 'Monthly Sales Trend'}">Sales Trend</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="salesTrendChart" height="100"></canvas>
                    </div>
                </div>
                
                <!-- Data Table -->
                <div class="card">
                    <div class="card-header">
                        <h5 th:text="${reportType == 'daily' ? 'Daily Sales Data' : 'Monthly Sales Data'}">Sales Data</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th th:text="${reportType == 'daily' ? 'Date' : 'Month'}">Period</th>
                                        <th>Revenue</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="entry : ${salesData}">
                                        <td th:text="${entry.key}">2023-01-01</td>
                                        <td th:text="${'₱' + #numbers.formatDecimal(entry.value, 0, 2)}">₱100.00</td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr class="table-active">
                                        <th>Total</th>
                                        <th th:text="${'₱' + #numbers.formatDecimal(totalSales, 0, 2)}">₱1000.00</th>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
                
                <!-- Navigation Buttons -->
                <div class="mt-4">
                    <div class="btn-group">
                        <a th:href="@{/admin/reports/index}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left mr-2"></i> Back to Reports
                        </a>
                        <a th:href="@{/admin/dashboard}" class="btn btn-primary">
                            <i class="fas fa-tachometer-alt mr-2"></i> Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Fix notification scripts fragment syntax -->
    <th:block th:replace="~{notification-fragment :: notification-scripts}"></th:block>
    <script th:src="@{/js/script.js}"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Sales Trend Chart
            const salesData = /*[[${salesData}]]*/ {};
            const reportType = /*[[${reportType}]]*/ 'daily';
            
            console.log('Report Type:', reportType);
            console.log('Sales data:', salesData);
            
            // Extract labels and values from the salesData object
            const salesLabels = Object.keys(salesData);
            const salesValues = Object.values(salesData).map(value => parseFloat(value));
            
            console.log('Sales labels:', salesLabels);
            console.log('Sales values:', salesValues);
            
            // Check if we have data to display
            if (salesLabels.length > 0 && salesValues.length > 0) {
                new Chart(document.getElementById('salesTrendChart'), {
                    type: reportType === 'daily' ? 'line' : 'bar',
                    data: {
                        labels: salesLabels,
                        datasets: [{
                            label: 'Revenue',
                            data: salesValues,
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return '₱' + value.toFixed(2);
                                    }
                                }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return 'Revenue: ₱' + context.raw.toFixed(2);
                                    }
                                }
                            },
                            title: {
                                display: true,
                                text: reportType === 'daily' ? 'Daily Revenue' : 'Monthly Revenue'
                            }
                        }
                    }
                });
            } else {
                // Display a message if no data is available
                const chartContainer = document.getElementById('salesTrendChart').parentNode;
                chartContainer.innerHTML = '<div class="alert alert-info text-center">No sales data available for the selected period.</div>';
            }
        });
    </script>
</body>
</html>
