<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Screening</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{#}">Movie Ticket Booking System</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/movies}">Movies</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" th:href="@{/admin/screenings}">Screenings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/bookings}">Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/users}">Users</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Edit Screening</h4>
                    </div>
                    <div class="card-body">
                        <!-- Success and Error Messages -->
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${success}"></span>
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${error}"></span>
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        
                        <form th:action="@{/admin/screenings/edit/{id}(id=${screeningId})}" method="post" id="screeningForm">
                            <input type="hidden" id="screeningId" name="screeningId" th:value="${screeningId}">
                            <div class="form-group">
                                <label for="movieId">Movie</label>
                                <select class="form-control" id="movieId" name="movieId" required>
                                    <option value="">Select Movie</option>
                                    <option th:each="movie : ${movies}" 
                                            th:value="${movie.id}" 
                                            th:text="${movie.title}"
                                            th:selected="${movie.id == screening.movie.id}"></option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="cinemaId">Cinema</label>
                                <select class="form-control" id="cinemaId" name="cinemaId" required>
                                    <option value="">Select Cinema</option>
                                    <option th:each="cinema : ${cinemas}" 
                                            th:value="${cinema.id}" 
                                            th:text="${cinema.name}"
                                            th:selected="${cinema.id == screening.cinema.id}"></option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="screeningDate">Screening Date</label>
                                <input type="date" class="form-control" id="screeningDate" name="screeningDate" 
                                       th:value="${#temporals.format(screening.screeningTime, 'yyyy-MM-dd')}" required>
                            </div>
                            
                            <div class="form-group">
                                <label>Screening Time</label>
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle"></i> Select a time for this screening. 
                                    Only available times are shown. The current time is always available.
                                </div>
                                
                                <div id="timeOptions" class="mb-3">
                                    <div th:each="time : ${availableTimes}" class="time-option" 
                                         th:classappend="${#temporals.format(screening.screeningTime, 'HH:mm') == time} ? 'selected' : ''"
                                         th:data-value="${time}" 
                                         th:text="${time}">
                                    </div>
                                </div>
                                
                                <input type="hidden" id="screeningTime" name="screeningTime" 
                                       th:value="${#temporals.format(screening.screeningTime, 'HH:mm')}" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="price">Ticket Price (₱)</label>
                                <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" 
                                       th:value="${screening.price}" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="totalSeats">Total Seats</label>
                                <input type="number" class="form-control" id="totalSeats" name="totalSeats" min="1" 
                                       th:value="${screening.totalSeats}" required>
                                <small class="form-text text-muted">
                                    <span th:if="${screening.totalSeats - screening.availableSeats > 0}" class="text-warning">
                                        <i class="fas fa-exclamation-triangle"></i> 
                                        <span th:text="${screening.totalSeats - screening.availableSeats}"></span> seats are already booked. 
                                        Reducing total seats below this number will not be allowed.
                                    </span>
                                </small>
                            </div>
                            
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Update Screening
                                </button>
                                <a th:href="@{/admin/screenings}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Back
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
