<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Users Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="admin-sidebar :: sidebar(active='users')"></div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Users Management</h2>
                    <form th:action="@{/admin/users/search}" method="get" class="form-inline">
                        <div class="input-group">
                            <input type="text" name="keyword" class="form-control" placeholder="Search users..." th:value="${keyword}">
                            <div class="input-group-append">
                                <button type="submit" class="btn btn-primary">Search</button>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Status</th>
                                        <th>Role</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td>
                                            <span th:if="${user.enabled}" class="badge badge-success">Active</span>
                                            <span th:unless="${user.enabled}" class="badge badge-danger">Inactive</span>
                                        </td>
                                        <td>
                                            <span th:each="role : ${user.roles}" th:text="${role.name}" class="badge badge-info mr-1"></span>
                                        </td>
                                        <td>
                                            <div class="btn-group">
                                                <a th:href="@{/admin/users/view/{id}(id=${user.id})}" class="btn btn-sm btn-info">View</a>
                                                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-warning">Edit</a>
                                                <a th:if="${user.enabled}" th:href="@{/admin/users/disable/{id}(id=${user.id})}" class="btn btn-sm btn-secondary">Disable</a>
                                                <a th:unless="${user.enabled}" th:href="@{/admin/users/enable/{id}(id=${user.id})}" class="btn btn-sm btn-success">Enable</a>
                                                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-danger" 
                                                   onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${users.empty}">
                                        <td colspan="6" class="text-center">No users found</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
