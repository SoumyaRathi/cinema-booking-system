<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Screening Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        .movie-poster {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .table-actions {
            white-space: nowrap;
        }
        
        /* Seat Layout Styles */
        .seat-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        .seat-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            gap: 5px;
        }
        
        .row-label {
            font-weight: bold;
            margin-right: 15px;
            width: 25px;
            text-align: center;
            font-size: 16px;
        }
        
        .seat-grid {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .seat {
            width: 32px;
            height: 32px;
            border: 2px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        
        .seat.available {
            background-color: #28a745;
            border-color: #1e7e34;
            cursor: pointer;
        }
        
        .seat.available:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
        
        .seat.booked {
            background-color: #dc3545;
            border-color: #c82333;
            cursor: not-allowed;
        }
        
        .seat-legend {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .legend-seat {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid;
        }
        
        .legend-seat.available {
            background-color: #28a745;
            border-color: #1e7e34;
        }
        
        .legend-seat.booked {
            background-color: #dc3545;
            border-color: #c82333;
        }
        
        .screen-indicator {
            background: linear-gradient(135deg, #343a40, #495057);
            color: white;
            text-align: center;
            padding: 12px 20px;
            margin: 20px auto 30px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            max-width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .modal-lg {
            max-width: 900px;
        }
        
        .seat-info-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .screening-info-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .seat-details {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .seat {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
            
            .row-label {
                width: 20px;
                margin-right: 10px;
                font-size: 14px;
            }
            
            .seat-grid {
                gap: 2px;
            }
            
            .modal-lg {
                max-width: 95%;
                margin: 10px auto;
            }
        }
        
        @media (max-width: 576px) {
            .seat {
                width: 24px;
                height: 24px;
                font-size: 9px;
            }
            
            .seat-legend {
                gap: 15px;
            }
            
            .legend-item {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="admin-sidebar :: sidebar(active='screenings')"></div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>Screening Management</h1>
                    <a th:href="@{/admin/screenings/add}" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add New Screening
                    </a>
                </div>
                
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Filter Screenings</h5>
                    </div>
                    <div class="card-body">
                        <form id="filterForm" class="form-inline">
                            <div class="form-group mr-3 mb-2">
                                <label for="movieFilter" class="mr-2">Movie:</label>
                                <select class="form-control" id="movieFilter">
                                    <option value="">All Movies</option>
                                    <option th:each="movie : ${movies}" 
                                            th:value="${movie.id}" 
                                            th:text="${movie.title}"></option>
                                </select>
                            </div>
                            <div class="form-group mr-3 mb-2">
                                <label for="cinemaFilter" class="mr-2">Cinema:</label>
                                <select class="form-control" id="cinemaFilter">
                                    <option value="">All Cinemas</option>
                                    <option th:each="cinema : ${cinemas}" 
                                            th:value="${cinema.id}" 
                                            th:text="${cinema.name}"></option>
                                </select>
                            </div>
                            <div class="form-group mr-3 mb-2">
                                <label for="dateFilter" class="mr-2">Date:</label>
                                <input type="date" class="form-control" id="dateFilter">
                            </div>
                            <button type="button" class="btn btn-primary mb-2" id="applyFilterBtn">
                                <i class="fas fa-filter"></i> Apply Filter
                            </button>
                            <button type="button" class="btn btn-secondary mb-2 ml-2" id="resetFilterBtn">
                                <i class="fas fa-undo"></i> Reset
                            </button>
                        </form>
                    </div>
                </div>
                
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="screeningsTable">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>Movie</th>
                                        <th>Cinema</th>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Price</th>
                                        <th>Total Seats</th>
                                        <th>Available Seats</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="screening : ${screenings}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <!-- FIXED: Use effectiveImageUrl method for proper poster display -->
                                                <img th:if="${screening.movie.effectiveImageUrl != null && !screening.movie.effectiveImageUrl.isEmpty()}" 
                                                     th:src="${screening.movie.effectiveImageUrl}" 
                                                     class="movie-poster mr-2" 
                                                     alt="Movie Poster"
                                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                                <div th:unless="${screening.movie.effectiveImageUrl != null && !screening.movie.effectiveImageUrl.isEmpty()}" 
                                                     class="movie-poster mr-2 d-flex align-items-center justify-content-center bg-light"
                                                     style="display: none;">
                                                    <i class="fas fa-film text-muted"></i>
                                                </div>
                                                <span th:text="${screening.movie.title}"></span>
                                            </div>
                                        </td>
                                        <td th:text="${screening.cinema.name}"></td>
                                        <td th:text="${#temporals.format(screening.screeningTime, 'EEE, MMM dd, yyyy')}"></td>
                                        <td th:text="${#temporals.format(screening.screeningTime, 'HH:mm')}"></td>
                                        <td th:text="${'₱' + #numbers.formatDecimal(screening.price, 1, 2)}"></td>
                                        <td th:text="${screening.totalSeats}"></td>
                                        <td>
                                            <span th:text="${screening.availableSeats}"></span>
                                            <span th:if="${screening.availableSeats == 0}" class="badge badge-danger ml-1">Sold Out</span>
                                            <span th:if="${screening.availableSeats < 10 && screening.availableSeats > 0}" class="badge badge-warning ml-1">Limited</span>
                                        </td>
                                        <td class="table-actions">
                                            <button class="btn btn-sm btn-success mr-1" title="View Seats" 
                                                    th:onclick="'viewSeats(' + ${screening.id} + ')'">
                                                <i class="fas fa-chair"></i>
                                            </button>
                                            <a th:href="@{/admin/screenings/edit/{id}(id=${screening.id})}" class="btn btn-sm btn-info mr-1" title="Edit">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a th:href="@{/admin/screenings/delete/{id}(id=${screening.id})}" class="btn btn-sm btn-danger" 
                                               title="Delete" onclick="return confirm('Are you sure you want to delete this screening?')">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${screenings.empty}">
                                        <td colspan="8" class="text-center">No screenings found</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Seat View Modal -->
    <div class="modal fade" id="seatModal" tabindex="-1" role="dialog" aria-labelledby="seatModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="seatModalLabel">Seat Layout</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Screening Information -->
                    <div id="screeningInfo" class="screening-info-card">
                        <!-- Screening info will be loaded here -->
                    </div>
                    <!-- Seat Legend (Simplified) -->
                    <div class="seat-legend">
                        <div class="legend-item">
                            <div class="legend-seat available"></div>
                            <span>Available</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-seat booked"></div>
                            <span>Booked</span>
                        </div>
                    </div>
                    
                    <!-- Screen Indicator -->
                    <div class="screen-indicator">
                        <i class="fas fa-desktop"></i> SCREEN
                    </div>
                    
                    <!-- Seat Layout Container -->
                    <div class="seat-container">
                        <div id="seatLayout">
                            <!-- Seat layout will be loaded here -->
                        </div>
                    </div>
                    
                    <!-- Seat Details (Shows when clicking on a seat) -->
                    <div id="seatDetails" class="seat-details">
                        <!-- Seat details will be shown here when clicking on a seat -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="refreshSeats" onclick="refreshSeatLayout()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script th:inline="javascript">
        let currentScreeningId = null;
        
        // Get the context path from Thymeleaf
        const contextPath = /*[[@{/}]]*/ '/';
        console.log('Context path:', contextPath);
        
        // Auto-dismiss alerts after 5 seconds
        $(document).ready(function() {
            setTimeout(function() {
                $('.alert').alert('close');
            }, 5000); 
            
            // Filter functionality
            $('#applyFilterBtn').click(function() {
                filterScreenings();
            });
            
            $('#resetFilterBtn').click(function() {
                $('#movieFilter').val('');
                $('#cinemaFilter').val('');
                $('#dateFilter').val('');
                filterScreenings();
            });
            
            function filterScreenings() {
                var movieId = $('#movieFilter').val();
                var cinemaId = $('#cinemaFilter').val();
                var date = $('#dateFilter').val();
                
                $('#screeningsTable tbody tr').each(function() {
                    var row = $(this);
                    var showRow = true;
                    
                    // Skip the "No screenings found" row
                    if (row.find('td').length === 1) {
                        return;
                    }
                    
                    // Filter by movie
                    if (movieId && row.find('td:eq(0)').text().trim() !== $('#movieFilter option:selected').text().trim()) {
                        showRow = false;
                    }
                    
                    // Filter by cinema
                    if (cinemaId && row.find('td:eq(1)').text().trim() !== $('#cinemaFilter option:selected').text().trim()) {
                        showRow = false;
                    }
                    
                    // Filter by date
                    if (date) {
                        var rowDate = new Date(row.find('td:eq(2)').text().trim());
                        var filterDate = new Date(date);
                        
                        if (rowDate.toDateString() !== filterDate.toDateString()) {
                            showRow = false;
                        }
                    }
                    
                    if (showRow) {
                        row.show();
                    } else {
                        row.hide();
                    }
                });
                
                // Show "No screenings found" if all rows are hidden
                var visibleRows = $('#screeningsTable tbody tr:visible').length;
                if (visibleRows === 0) {
                    var colSpan = $('#screeningsTable thead th').length;
                    var noScreeningsRow = '<tr><td colspan="' + colSpan + '" class="text-center">No screenings found matching the filters</td></tr>';
                    
                    // Remove existing "No screenings found" row if it exists
                    $('#screeningsTable tbody tr td[colspan="' + colSpan + '"]').parent().remove();
                    
                    // Add new "No screenings found" row
                    $('#screeningsTable tbody').append(noScreeningsRow);
                }
            }
        });
        
        function viewSeats(screeningId) {
            console.log('viewSeats called with screeningId:', screeningId);
            currentScreeningId = screeningId;
            
            // Hide seat details and show loading
            $('#seatDetails').hide();
            $('#seatLayout').html('<div class="text-center p-4"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading seats...</div>');
            $('#seatModal').modal('show');
            
            // Load seat data
            loadSeatLayout(screeningId);
        }
        
        function loadSeatLayout(screeningId) {
            // Use Thymeleaf to generate the correct URL
            var url = contextPath + 'admin/screenings/' + screeningId + '/seats';
            console.log('Loading seats from URL:', url);
            
            $.ajax({
                url: url,
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    console.log('Seat data received:', response);
                    displaySeatLayout(response);
                },
                error: function(xhr, status, error) {
                    console.error('AJAX Error Details:', {
                        status: xhr.status,
                        statusText: xhr.statusText,
                        responseText: xhr.responseText,
                        error: error,
                        url: url
                    });
                    
                    var errorMessage = 'Error loading seats: ';
                    if (xhr.status === 404) {
                        errorMessage += 'Endpoint not found (404)';
                    } else if (xhr.status === 403) {
                        errorMessage += 'Access denied (403)';
                    } else if (xhr.status === 500) {
                        errorMessage += 'Server error (500)';
                    } else {
                        errorMessage += xhr.status + ' - ' + error;
                    }
                    
                    if (xhr.responseText) {
                        errorMessage += '<br><small>Response: ' + xhr.responseText + '</small>';
                    }
                    
                    $('#seatLayout').html('<div class="alert alert-danger">' + errorMessage + '</div>');
                }
            });
        }
        
        function displaySeatLayout(data) {
            console.log('Displaying seat layout with data:', data);
            
            // Update screening info
            $('#screeningInfo').html(
                '<h6 class="mb-3">' + data.movieTitle + '</h6>' +
                '<div class="row">' +
                '<div class="col-md-6">' +
                '<strong>Cinema:</strong> ' + data.cinemaName + '<br>' +
                '<strong>Date & Time:</strong> ' + data.screeningDateTime +
                '</div>' +
                '<div class="col-md-6">' +
                '<strong>Total Seats:</strong> ' + data.totalSeats + '<br>' +
                '<strong>Available:</strong> ' + data.availableSeats + ' | ' +
                '<strong>Booked:</strong> ' + (data.totalSeats - data.availableSeats) +
                '</div>' +
                '</div>'
            );
            
            // Group seats by row
            let seatsByRow = {};
            data.seats.forEach(seat => {
                if (!seatsByRow[seat.row]) {
                    seatsByRow[seat.row] = [];
                }
                seatsByRow[seat.row].push(seat);
            });
            
            // Sort rows alphabetically
            let sortedRows = Object.keys(seatsByRow).sort();
            
            let seatLayoutHtml = '';
            
            sortedRows.forEach(row => {
                // Sort seats in row by column
                seatsByRow[row].sort((a, b) => a.seatColumn - b.seatColumn);
                
                seatLayoutHtml += '<div class="seat-row">';
                seatLayoutHtml += '<div class="row-label">' + row + '</div>';
                seatLayoutHtml += '<div class="seat-grid">';
                
                seatsByRow[row].forEach(seat => {
                    let seatClass = seat.booked ? 'booked' : 'available';
                    
                    seatLayoutHtml += '<div class="seat ' + seatClass + '" ' +
                        'data-seat-id="' + seat.id + '" ' +
                        'data-seat-number="' + seat.seatNumber + '" ' +
                        'data-seat-type="' + seat.type + '" ' +
                        'data-seat-price="' + seat.price + '" ' +
                        'data-seat-booked="' + seat.booked + '" ' +
                        'title="Seat ' + seat.seatNumber + (seat.booked ? ' (Booked)' : ' (Available)') + '"' +
                        ' onclick="showSeatDetails(this)">' +
                        seat.seatColumn +
                        '</div>';
                });
                
                seatLayoutHtml += '</div></div>';
            });
            
            $('#seatLayout').html(seatLayoutHtml);
        }
        
        function showSeatDetails(seatElement) {
            let seatId = $(seatElement).data('seat-id');
            let seatNumber = $(seatElement).data('seat-number');
            let seatType = $(seatElement).data('seat-type');
            let seatPrice = $(seatElement).data('seat-price');
            let isBooked = $(seatElement).data('seat-booked');
            
            let statusBadge = isBooked ? 
                '<span class="badge badge-danger">Booked</span>' : 
                '<span class="badge badge-success">Available</span>';
            
            $('#seatDetails').html(
                '<h6>Seat Information</h6>' +
                '<div class="row">' +
                '<div class="col-md-6">' +
                '<strong>Seat Number:</strong> ' + seatNumber + '<br>' +
                '<strong>Type:</strong> ' + seatType + '<br>' +
                '<strong>Price:</strong> ₱' + parseFloat(seatPrice).toFixed(2) +
                '</div>' +
                '<div class="col-md-6">' +
                '<strong>Status:</strong> ' + statusBadge + '<br>' +
                '<strong>Row:</strong> ' + seatNumber.charAt(0) + '<br>' +
                '<strong>Column:</strong> ' + seatNumber.substring(1) +
                '</div>' +
                '</div>'
            ).show();
        }
        
        function refreshSeatLayout() {
            if (currentScreeningId) {
                $('#seatDetails').hide();
                $('#seatLayout').html('<div class="text-center p-4"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Refreshing...</div>');
                loadSeatLayout(currentScreeningId);
            }
        }
    </script>
</body>
</html>
