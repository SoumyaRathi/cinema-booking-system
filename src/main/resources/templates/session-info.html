<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Session Information</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Session Information</h1>
        
        <div th:if="${sessionId != null}" class="card mt-4">
            <div class="card-header">
                <h3>Session Details</h3>
            </div>
            <div class="card-body">
                <p><strong>Session ID:</strong> <span th:text="${sessionId}"></span></p>
                <p><strong>Creation Time:</strong> <span th:text="${#dates.format(new java.util.Date(creationTime), 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                <p><strong>Last Accessed Time:</strong> <span th:text="${#dates.format(new java.util.Date(lastAccessedTime), 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                <p><strong>Max Inactive Interval:</strong> <span th:text="${maxInactiveInterval + ' seconds'}"></span></p>
            </div>
        </div>
        
        <div th:if="${userSession != null}" class="card mt-4">
            <div class="card-header">
                <h3>User Session Data</h3>
            </div>
            <div class="card-body">
                <p><strong>User ID:</strong> <span th:text="${userSession.userId}"></span></p>
                <p><strong>Username:</strong> <span th:text="${userSession.username}"></span></p>
                <p><strong>Email:</strong> <span th:text="${userSession.email}"></span></p>
                <p><strong>Full Name:</strong> <span th:text="${userSession.fullName}"></span></p>
                <p><strong>Admin:</strong> <span th:text="${userSession.admin ? 'Yes' : 'No'}"></span></p>
                <p><strong>Last Access:</strong> <span th:text="${#temporals.format(userSession.lastAccess, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
            </div>
        </div>
        
        <div th:unless="${sessionId != null}" class="alert alert-warning mt-4">
            <p>No active session found.</p>
        </div>
        
        <div class="mt-4">
            <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
            <a th:href="@{/dashboard}" class="btn btn-primary ml-2">Dashboard</a>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
