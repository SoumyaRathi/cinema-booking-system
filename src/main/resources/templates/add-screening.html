<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Screening</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">Movie Ticket Booking System</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/movies}">Movies</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" th:href="@{/admin/screenings}">Screenings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/bookings}">Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/users}">Users</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Add New Screening</h1>
            <a th:href="@{/admin/screenings}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Screenings
            </a>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/admin/screenings/add}" th:object="${screening}" method="post">
                    <div class="form-group">
                        <label for="movieId">Movie <span class="text-danger">*</span></label>
                        <select class="form-control" id="movieId" name="movieId" required>
                            <option value="">-- Select Movie --</option>
                            <option th:each="movie : ${movies}" 
                                    th:value="${movie.id}" 
                                    th:text="${movie.title}"></option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="screeningDateTime">Date & Time <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="screeningDateTime" name="screeningDateTime" placeholder="YYYY-MM-DD HH:MM" required>
                        <small class="form-text text-muted">Format: YYYY-MM-DD HH:MM (e.g., 2025-04-25 07:30)</small>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="theater">Theater <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="theater" th:field="*{theater}" required>
                        </div>
                        
                        <div class="form-group col-md-4">
                            <label for="price">Price <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">$</span>
                                </div>
                                <input type="number" class="form-control" id="price" th:field="*{price}" min="0.01" step="0.01" required>
                            </div>
                        </div>
                        
                        <div class="form-group col-md-4">
                            <label for="totalSeats">Total Seats <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="totalSeats" th:field="*{totalSeats}" min="1" required>
                        </div>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/screenings}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Screening
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2023 Movie Ticket Booking System. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
