<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Tickets</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Movie Ticket Booking</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/movies}">Movies</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/bookings/my-bookings}">My Bookings</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-4">
                <img th:if="${movie.imageUrl != null && !movie.imageUrl.isEmpty()}" 
                     th:src="${movie.imageUrl}" 
                     class="img-fluid movie-poster" 
                     alt="Movie Poster">
                <img th:if="${movie.imageUrl == null || movie.imageUrl.isEmpty()}" 
                     th:src="@{/images/default-movie.jpg}" 
                     class="img-fluid movie-poster" 
                     alt="Default Movie Poster">
            </div>
            <div class="col-md-8">
                <h1 th:text="${movie.title}" class="mb-3"></h1>
                
                <div class="mb-3">
                    <span class="badge badge-primary mr-2" th:text="${movie.genre}"></span>
                    <span class="badge badge-secondary mr-2" th:text="${movie.duration}"></span>
                </div>
                
                <p class="lead" th:text="${movie.description}"></p>
                
                <div class="mb-3">
                    <strong>Director:</strong> <span th:text="${movie.director}"></span><br>
                    <strong>Cast:</strong> <span th:text="${movie.cast}"></span>
                </div>
                
                <div th:if="${movie.trailerUrl != null && !movie.trailerUrl.isEmpty()}" class="mb-3">
                    <a th:href="${movie.trailerUrl}" target="_blank" class="btn btn-outline-danger">
                        <i class="fab fa-youtube"></i> Watch Trailer
                    </a>
                </div>
            </div>
        </div>
        
        <h2 class="mb-4">Available Screenings</h2>
        
        <div th:if="${#lists.isEmpty(screenings)}" class="alert alert-info">
            No screenings available for this movie.
        </div>
        
        <div class="row">
            <div th:each="screening : ${screenings}" class="col-md-4 mb-4">
                <div th:class="${screening.availableSeats > 0 ? 'card screening-card' : 'card screening-card sold-out'}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${#temporals.format(screening.screeningTime, 'EEEE, MMM dd, yyyy')}"></h5>
                        <h6 class="card-subtitle mb-2 text-muted" th:text="${#temporals.format(screening.screeningTime, 'HH:mm')}"></h6>
                        
                        <ul class="list-unstyled mt-3">
                            <li><i class="fas fa-map-marker-alt text-primary mr-2"></i> <span th:text="${screening.theater}"></span></li>
                            <li><i class="fas fa-dollar-sign text-success mr-2"></i> <span th:text="${'$' + #numbers.formatDecimal(screening.price, 1, 2)}"></span></li>
                            <li><i class="fas fa-chair text-info mr-2"></i> <span th:text="${screening.availableSeats + ' seats available'}"></span></li>
                        </ul>
                        
                        <div class="mt-3">
                            <a th:if="${screening.availableSeats > 0}" 
                               th:href="@{/bookings/screening/{id}(id=${screening.id})}" 
                               class="btn btn-primary btn-block">
                                <i class="fas fa-ticket-alt mr-1"></i> Book Tickets
                            </a>
                            <button th:unless="${screening.availableSeats > 0}" 
                                    class="btn btn-secondary btn-block" disabled>
                                <i class="fas fa-ban mr-1"></i> Sold Out
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <a th:href="@{/movies}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Back to Movies
            </a>
        </div>
    </div>
    
    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2023 Movie Ticket Booking System. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
