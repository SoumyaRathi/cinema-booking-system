<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="admin-sidebar :: sidebar(active='movies')"></div>
        
        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Movie Management</h1>
                <a th:href="@{/admin/movies/add}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add New Movie
                </a>
            </div>
            
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="thead-dark">
                                <tr>
                                    <th>Poster</th>
                                    <th>Title</th>
                                    <th>Genre</th>
                                    <th>Duration</th>
                                    <th>Rating</th>
                                    <th>Language</th>
                                    <th>Screening Duration</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="movie : ${movies}">
                                    <td>
                                        <!-- NEW: Use effectiveImageUrl method -->
                                        <img th:if="${movie.effectiveImageUrl != null}" 
                                             th:src="${movie.effectiveImageUrl}" 
                                             class="movie-poster" 
                                             alt="Movie Poster"
                                             style="width: 50px; height: 75px; object-fit: cover;">
                                        <div th:unless="${movie.effectiveImageUrl != null}" 
                                             class="movie-poster d-flex align-items-center justify-content-center bg-light"
                                             style="width: 50px; height: 75px;">
                                            <i class="fas fa-film text-muted"></i>
                                        </div>
                                    </td>
                                    <td th:text="${movie.title}"></td>
                                    <td th:text="${movie.genre}"></td>
                                    <td th:text="${movie.duration + ' min'}"></td>
                                    <td>
                                        <span th:if="${movie.rating != null && !movie.rating.isEmpty()}" 
                                              class="badge badge-rating" 
                                              th:text="${movie.rating}"></span>
                                        <span th:unless="${movie.rating != null && !movie.rating.isEmpty()}" 
                                              class="text-muted">-</span>
                                    </td>
                                    <td>
                                        <span th:if="${movie.language != null && !movie.language.isEmpty()}" 
                                              class="badge badge-language" 
                                              th:text="${movie.language}"></span>
                                        <span th:unless="${movie.language != null && !movie.language.isEmpty()}" 
                                              class="text-muted">-</span>
                                    </td>
                                    <td th:text="${movie.screeningDurationDays != null ? movie.screeningDurationDays + ' days' : '28 days'}"></td>
                                    <td>
                                        <span th:if="${movie.released}" class="badge badge-success">Released</span>
                                        <span th:unless="${movie.released}" class="badge badge-secondary">Not Released</span>
                                    </td>
                                    <td class="table-actions">
                                        <a th:href="@{/admin/movies/edit/{id}(id=${movie.id})}" class="btn btn-sm btn-info" title="Edit">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{/admin/movies/delete/{id}(id=${movie.id})}" class="btn btn-sm btn-danger" 
                                           title="Delete" onclick="return confirm('Are you sure you want to delete this movie?')">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                        <a th:href="@{/admin/movies/{id}/screenings(id=${movie.id})}" class="btn btn-sm btn-primary" title="Manage Screenings">
                                            <i class="fas fa-calendar-alt"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${movies.empty}">
                                    <td colspan="9" class="text-center">No movies found</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
