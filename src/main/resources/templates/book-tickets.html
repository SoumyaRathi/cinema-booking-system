<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Tickets</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .ticket-quantity-selector {
            margin-bottom: 1rem;
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        
        .quantity-btn {
            width: 40px;
            height: 40px;
            border: 2px solid #007bff;
            background-color: #fff;
            color: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .quantity-btn:hover:not(:disabled) {
            background-color: #007bff;
            color: #fff;
        }
        
        .quantity-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #6c757d;
            color: #6c757d;
        }
        
        .quantity-display {
            font-size: 24px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            padding: 8px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        
        .seats-info {
            font-size: 14px;
            color: #6c757d;
            text-align: center;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Movie Ticket Booking</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/movies}">Movies</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/bookings/my-bookings}">My Bookings</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}">My Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Book Tickets</h1>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <img th:if="${movie.effectiveImageUrl != null && !movie.effectiveImageUrl.isEmpty()}" 
                     th:src="${movie.effectiveImageUrl}" 
                     class="img-fluid movie-poster mb-3" 
                     alt="Movie Poster">
                <img th:if="${movie.effectiveImageUrl == null || movie.effectiveImageUrl.isEmpty()}" 
                     th:src="@{/images/default-movie.jpg}" 
                     class="img-fluid movie-poster mb-3" 
                     alt="Default Movie Poster">
                     
                <div class="ticket-info">
                    <h5 th:text="${movie.title}" class="mb-3"></h5>
                    
                    <ul class="list-unstyled">
                        <li class="mb-2">
                            <i class="far fa-calendar-alt text-primary mr-2"></i> 
                            <span th:text="${#temporals.format(screening.screeningTime, 'EEEE, MMM dd, yyyy')}"></span>
                        </li>
                        <li class="mb-2">
                            <i class="far fa-clock text-primary mr-2"></i> 
                            <span th:text="${#temporals.format(screening.screeningTime, 'HH:mm')}"></span>
                        </li>
                        <li class="mb-2">
                            <i class="fas fa-map-marker-alt text-primary mr-2"></i> 
                            <span th:text="${screening.theater}"></span>
                        </li>
                        <li class="mb-2">
                            <i class="fas fa-dollar-sign text-success mr-2"></i> 
                            <span th:text="${'₱' + #numbers.formatDecimal(screening.price, 1, 2) + ' per ticket'}">₱12.99 per ticket</span>
                        </li>
                        <li>
                            <i class="fas fa-chair text-info mr-2"></i> 
                            <span th:text="${screening.availableSeats + ' seats available'}"></span>
                        </li>
                    </ul>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Booking Details</h5>
                    </div>
 <div class="card-body">
                        <form th:action="@{/bookings/screening/{id}(id=${screening.id})}" method="post">
                            <div class="form-group ticket-quantity-selector">
                                <label for="numberOfSeats">Number of Tickets <span class="text-danger">*</span></label>
                                <div class="quantity-control">
                                    <button type="button" class="quantity-btn" id="decreaseTickets">
                                        <i class="fas fa-minus"></i>
                                    </button>
                                    <div class="quantity-display" id="ticketDisplay">1</div>
                                    <button type="button" class="quantity-btn" id="increaseTickets">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                    <input type="hidden" id="numberOfSeats" name="numberOfSeats" value="1">
                                </div>
                                <div class="seats-info">
                                    <span th:text="${screening.availableSeats}" id="availableSeatsDisplay"></span> seats available
                                </div>
                            </div> 
                            <div class="form-group">
                                <label>Price per Ticket</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">₱</span>
                                    </div>
                                    <input type="text" class="form-control" th:value="${#numbers.formatDecimal(screening.price, 1, 2)}" readonly>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>Total Price</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">₱</span>
                                    </div>
                                    <input type="text" class="form-control" id="totalPrice" value="0.00" readonly>
                                </div>
                            </div>
                            
                            <hr>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/movies/{id}(id=${movie.id})}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Back
                                </a>
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-shopping-cart"></i> Confirm Booking
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2023 Movie Ticket Booking System. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
    
    <script th:inline="javascript">
        $(document).ready(function() {
            // Get data from Thymeleaf
            const availableSeats = [[${screening.availableSeats}]];
            const ticketPrice = [[${screening.price}]];
            
            let currentTickets = 1;
            
            // Update display and calculations
            function updateTicketDisplay() {
                $('#ticketDisplay').text(currentTickets);
                $('#numberOfSeats').val(currentTickets);
                
                // Update total price
                const totalPrice = (ticketPrice * currentTickets).toFixed(2);
                $('#totalPrice').val(totalPrice);
                
                // Update button states
                $('#decreaseTickets').prop('disabled', currentTickets <= 1);
                $('#increaseTickets').prop('disabled', currentTickets >= availableSeats);
            }
            
            // Decrease tickets
            $('#decreaseTickets').click(function() {
                if (currentTickets > 1) {
                    currentTickets--;
                    updateTicketDisplay();
                }
            });
            
            // Increase tickets
            $('#increaseTickets').click(function() {
                if (currentTickets < availableSeats) {
                    currentTickets++;
                    updateTicketDisplay();
                }
            });
            
            // Initialize display
            updateTicketDisplay();
        });
    </script>
</body>
</html>
