<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sales by Movie Report</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style th:replace="notification-fragment :: notification-styles"></style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .movie-card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            margin-bottom: 20px;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .movie-poster {
            height: 150px;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 bg-dark text-white p-0" style="min-height: 100vh;">
                <div class="p-4">
                    <h4>Admin Panel</h4>
                </div>
                <div class="list-group list-group-flush">
                    <a th:href="@{/admin/dashboard}" class="list-group-item list-group-item-action bg-dark text-white">Dashboard</a>
                    <a th:href="@{/admin/movies}" class="list-group-item list-group-item-action bg-dark text-white">Movies</a>
                    <a th:href="@{/admin/users}" class="list-group-item list-group-item-action bg-dark text-white">Users</a>
                    <a th:href="@{/admin/bookings}" class="list-group-item list-group-item-action bg-dark text-white">Bookings</a>
                    <a th:href="@{/admin/no-shows}" class="list-group-item list-group-item-action bg-dark text-white">
                        No-Shows
                    </a>
                    <a th:href="@{/admin/reports}" class="list-group-item list-group-item-action bg-dark text-white active">
                        Reports
                    </a>
                    <a th:href="@{/admin/notifications}" class="list-group-item list-group-item-action bg-dark text-white">
                        Notifications
                        <span th:if="${unreadNotificationsCount > 0}" class="badge badge-danger ml-2" th:text="${unreadNotificationsCount}">0</span>
                    </a>
                    <a th:href="@{/admin/profile}" class="list-group-item list-group-item-action bg-dark text-white">Profile</a>
                    <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-dark text-white">Logout</a>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Sales by Movie Report</h2>
                    <div th:replace="notification-fragment :: notification-bell"></div>
                </div>
                
                <!-- Date Range Filter -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Date Range Filter</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/reports/sales-by-movie}" method="get" class="form-inline">
                            <div class="form-group mr-3">
                                <label for="startDate" class="mr-2">Start Date:</label>
                                <input type="date" id="startDate" name="startDate" class="form-control" th:value="${startDate}">
                            </div>
                            <div class="form-group mr-3">
                                <label for="endDate" class="mr-2">End Date:</label>
                                <input type="date" id="endDate" name="endDate" class="form-control" th:value="${endDate}">
                            </div>
                            <button type="submit" class="btn btn-primary">Apply Filter</button>
                        </form>
                    </div>
                </div>
                
                <!-- Top Movies Chart -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Top Movies by Revenue</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="topMoviesChart" height="300"></canvas>
                    </div>
                </div>
                
                <!-- Movie Performance Details -->
                <div class="card">
                    <div class="card-header">
                        <h5>Movie Performance Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div th:each="movie : ${movieSales}" class="col-md-4">
                                <div class="card movie-card">
                                    <img th:if="${movie.imageUrl != null}" th:src="${movie.imageUrl}" class="card-img-top movie-poster" alt="Movie Poster">
                                    <img th:unless="${movie.imageUrl != null}" src="/images/default-movie-poster.jpg" class="card-img-top movie-poster" alt="Default Movie Poster">
                                    <div class="card-body">
                                        <h5 class="card-title" th:text="${movie.title}">Movie Title</h5>
                                        <div class="d-flex justify-content-between mb-2">
                                            <span class="text-muted">Revenue:</span>
                                            <span class="font-weight-bold" th:text="${'₱' + #numbers.formatDecimal(movie.revenue, 0, 2)}">₱1000.00</span>
                                        </div>
                                        <div class="d-flex justify-content-between mb-2">
                                            <span class="text-muted">Tickets Sold:</span>
                                            <span class="font-weight-bold" th:text="${movie.ticketsSold}">100</span>
                                        </div>
                                        <div class="d-flex justify-content-between">
                                            <span class="text-muted">Avg. Ticket Price:</span>
                                            <span class="font-weight-bold" th:text="${movie.ticketsSold > 0 ? '₱' + #numbers.formatDecimal(movie.revenue / movie.ticketsSold, 0, 2) : '₱0.00'}">₱10.00</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Navigation Buttons -->
                <div class="mt-4">
                    <div class="btn-group">
                        <a th:href="@{/admin/reports/index}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left mr-2"></i> Back to Reports
                        </a>
                        <a th:href="@{/admin/dashboard}" class="btn btn-primary">
                            <i class="fas fa-tachometer-alt mr-2"></i> Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script th:replace="notification-fragment :: notification-scripts"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Top Movies Chart
            const movieData = /*[[${movieSales}]]*/ [];
            const movieLabels = movieData.map(movie => movie.title);
            const movieRevenues = movieData.map(movie => parseFloat(movie.revenue));
            const movieTickets = movieData.map(movie => movie.ticketsSold);
            
            console.log('Movie data:', movieData);
            console.log('Movie labels:', movieLabels);
            console.log('Movie revenues:', movieRevenues);
            console.log('Movie tickets:', movieTickets);
            
            new Chart(document.getElementById('topMoviesChart'), {
                type: 'bar',
                data: {
                    labels: movieLabels,
                    datasets: [
                        {
                            label: 'Revenue (₱)',
                            data: movieRevenues,
                            backgroundColor: 'rgba(75, 192, 192, 0.8)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Tickets Sold',
                            data: movieTickets,
                            backgroundColor: 'rgba(54, 162, 235, 0.8)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Revenue (₱)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return '₱' + value.toFixed(2);
                                }
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Tickets Sold'
                            },
                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = context.raw;
                                    if (label.includes('Revenue')) {
                                        return label + ': ₱' + value.toFixed(2);
                                    }
                                    return label + ': ' + value;
                                }
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
