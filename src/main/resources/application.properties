# Application Name
spring.application.name=movieticket

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movieticket2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# MySQL Configuration for Large Packets
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useUnicode=true
spring.datasource.hikari.data-source-properties.characterEncoding=utf8
spring.datasource.hikari.data-source-properties.autoReconnect=true
spring.datasource.hikari.data-source-properties.maxAllowedPacket=16777216

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Server Configuration - UPDATED FOR WAR DEPLOYMENT
server.address=0.0.0.0
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
# DO NOT set context-path for WAR - it's determined by WAR filename
# server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dagaangjustinemae06@gmail.com
spring.mail.password=${MAIL_PASSWORD:geqd zrja vibv kkhv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# File upload settings - UPDATED FOR LARGE IMAGES
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# File upload directory - FIXED FOR BOTH DEV AND PRODUCTION
# For development, it will use ./uploads
# For production in Tomcat, it will use ${catalina.home}/webapps/uploads if available
file.upload-dir=uploads
app.upload.dir=${file.upload-dir}
# Base URL will be dynamically determined
app.image.base-url=

# Static resources configuration - UPDATED FOR WAR
spring.web.resources.static-locations=classpath:/static/,file:${file.upload-dir}/
spring.mvc.static-path-pattern=/**
spring.web.resources.cache.period=3600
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.cache-public=true

# Session Configuration
server.servlet.session.timeout=2h
server.servlet.session.cookie.max-age=7200
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.movie.movieticket=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.com.movie.movieticket.service.FileStorageService=DEBUG
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.web.servlet.resource=DEBUG

# Development settings
spring.web.resources.chain.cache=false
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# HTTP/HTTPS Configuration
server.ssl.enabled=false
server.forward-headers-strategy=native

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Connection Pool Configuration - UPDATED FOR LARGE PACKETS
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Error handling
server.error.whitelabel.enabled=false
server.error.path=/error

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized